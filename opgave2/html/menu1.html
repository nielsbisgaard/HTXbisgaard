<!-- menu1.html -->

<!DOCTYPE html>
<html>
<head>
    <title>Menu 1</title>
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="icon" type="image/x-icon" href="../images/16x16.ico">
</head>
<body>
    <header id="header">
        <h1 class="header-text">Menu 1</h1>
    </header>
    <main id="main">
        <div class="homepage">
            <a href="../index.html" class="homepage-link">Forside</a>
        </div>
        <p class="main-text">Vælg forret og dessert:</p>
        <section id="forret-section">
            <h2 class="section-header">Forretter</h2>
            <div class="forret-container">
                <div class="forret-option">
                    <input type="radio" id="salat-radio" name="forret" value="salat">
                    <label for="salat-radio">Salat med kylling</label>
                    <p class="forret-description">En frisk salat med kylling og dressing</p>
                </div>
                <div class="forret-option">
                    <input type="radio" id="suppe-radio" name="forret" value="suppe">
                    <label for="suppe-radio">Suppe</label>
                    <p class="forret-description">En varm og cremet suppe</p>
                </div>
            </div>
        </section>
        <section id="dessert-section">
            <h2 class="section-header">Vælg dessert</h2>
            <div class="dessert-container">
                <div class="dessert-option">
                    <input type="radio" id="abelkage-radio" name="dessert" value="abelkage">
                    <label for="abelkage-radio">Æblekage</label>
                    <p class="dessert-description">En klassisk æblekage med vaniljeis</p>
                </div>
                <div class="dessert-option">
                    <input type="radio" id="chokoladekage-radio" name="dessert" value="chokoladekage">
                    <label for="chokoladekage-radio">Chokoladekage</label>
                    <p class="dessert-description">En rig og cremet chokoladekage</p>
                </div>
            </div>
        </section>
        <section>
            <button class="add-to-cart-button">Tilføj til kurv</button>
        </section>
    </main>
    <footer id="footer">
        <p class="footer-text">&copy; 2023 Niels' Sejeste Restaurant</p>
    </footer>
</body>
</html>
