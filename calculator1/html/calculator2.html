<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/calcstyles2.css">
    <title>Calculator 2</title>
</head>
<body>
    <header>
        <h1>Calculator 2</h1>
    </header>
    <nav>
        <a href="../index.html" class="homepage">home page</a>
    </nav>
    <main>
        <!-- calculator functionality will go here -->
        <div class="calculator-container">
            <div class="display" id="display"></div>
            <input type="text" class="text" id="text">
            <div class="button-container">
                <button class="button" id="knapclear">C</button>
                <button class="button" id="knap1">1</button>
                <button class="button" id="knap2">2</button>
                <button class="button" id="knap3">3</button>
                <button class="button" id="knapslet">&lt;</button>
                <button class="button" id="knap4">4</button>
                <button class="button" id="knap5">5</button>
                <button class="button" id="knap6">6</button>
                <button class="button" id="knapgange">*</button>
                <button class="button" id="knap7">7</button>
                <button class="button" id="knap8">8</button>
                <button class="button" id="knap9">9</button>
                <button class="button" id="knapdivider">/</button>
                <button class="button" id="knapplus">+</button>
                <button class="button" id="knapminus">-</button>
                <button class="button" id="knap0">0</button>
                <button class="button" id="knapligmed">=</button>
    </main>
    <footer>
        <!-- footer content will go here -->
    </footer>
    <script type="text/javascript" src="../js/main2.js"></script>
</body>
</html>
